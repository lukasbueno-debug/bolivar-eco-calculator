<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bolívar Eco-Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script src="actions.js" defer></script>
</head>
<body>
  <main>
    <header>
      <div class="language">
        <label for="language" data-i18n="language">Idioma</label>
        <select id="language">
          <option value="es">Español</option>
          <option value="en">English</option>
        </select>
      </div>
      <p class="school">COLEGIO BOLÍVAR</p>
      <h1>Bolívar Eco-Calculator</h1>
      <p class="intro" data-i18n="intro"></p>
    </header>

    <section id="form-card" class="card">
      <h2 data-i18n="habits"></h2>
      <form id="eco-form">
        <div class="fields">
          <div class="field">
            <label for="transport" data-i18n="transport"></label>
            <select id="transport">
              <option value="bus" data-i18n="bus"></option>
              <option value="car" data-i18n="car"></option>
              <option value="shared" data-i18n="shared"></option>
              <option value="active" data-i18n="active"></option>
            </select>
          </div>

          <div class="field">
            <label for="paper" data-i18n="paper"></label>
            <input id="paper" type="number" min="0" max="10000"
                   step="1" value="10" required>
          </div>

          <div class="field">
            <label for="recycling" data-i18n="recycling"></label>
            <select id="recycling">
              <option value="0" data-i18n="never"></option>
              <option value="0.5" data-i18n="sometimes"></option>
              <option value="1" data-i18n="always"></option>
            </select>
          </div>
        </div>
        <button type="submit" data-i18n="calculate"></button>
      </form>
    </section>

    <section id="results" class="card" hidden aria-live="polite">
      <h2 data-i18n="certificate"></h2>
      <p id="report-summary" class="summary"></p>
      <div class="stats">
        <div class="stat">
          <span data-i18n="co2"></span>
          <strong id="co2"></strong>
          <span data-i18n="weekly"></span>
        </div>
        <div class="stat">
          <span>Eco-Points</span>
          <strong id="points"></strong>
          <span data-i18n="outOf"></span>
        </div>
      </div>
      <p class="muted" data-i18n="educational"></p>
      <button id="print-button" type="button" data-i18n="print"></button>
    </section>

    <details class="card">
      <summary data-i18n="how"></summary>
      <p data-i18n="educational"></p>
      <p data-i18n="factors"></p>
      <p data-i18n="reduction"></p>
      <p data-i18n="scoring"></p>
    </details>

    <footer data-i18n="footer"></footer>
  </main>
</body>
</html>
